name: Build godot-js Lite
'on':
  workflow_dispatch:
    inputs:
      gode_ref:
        description: Gode branch, tag, or commit containing the canonical implementation
        type: string
        default: main
      libnode_url:
        description: libnode-lite.zip URL
        type: string
        default: https://github.com/moluopro/libnode/releases/download/24.21.0/libnode-lite.zip
  workflow_call:
    inputs:
      gode_ref:
        description: Gode branch, tag, or commit containing the canonical implementation
        type: string
        default: main
      libnode_url:
        description: libnode-lite.zip URL
        type: string
        default: https://github.com/moluopro/libnode/releases/download/24.21.0/libnode-lite.zip
permissions:
  contents: read
env:
  PYTHON_VERSION: '3.14'
  GODOT_VERSION: 4.7-stable
  LIBNODE_URL: https://github.com/moluopro/libnode/releases/download/24.21.0/libnode-lite.zip
  GODE_LITE: 'ON'
jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: windows
          arch: x64
          runner: windows-2022
          script: ./shell/build-windows.ps1 -Architecture x64 -Configuration Release
            -Fresh
          artifact_path: third/godot-js/addons/godot-js/binary/windows/x64/libgode_runtime.dll
          editor_artifact_path: third/godot-js/addons/godot-js/binary/editor/windows/x64/libgode_editor.dll
        - platform: linux
          arch: x64
          runner: ubuntu-22.04
          script: ./shell/build-linux.sh --arch x64 --config Release --fresh
          artifact_path: third/godot-js/addons/godot-js/binary/linux/x64/libgode_runtime.so
          editor_artifact_path: third/godot-js/addons/godot-js/binary/editor/linux/x64/libgode_editor.so
        - platform: macos
          arch: arm64
          runner: macos-26
          script: ./shell/build-macos.sh --arch arm64 --config Release --deployment-target
            10.15 --fresh
          artifact_path: third/godot-js/addons/godot-js/binary/macos/arm64/libgode_runtime.dylib
          editor_artifact_path: third/godot-js/addons/godot-js/binary/editor/macos/arm64/libgode_editor.dylib
        - platform: ios
          arch: arm64
          runner: macos-26
          script: ./shell/build-ios.sh --arch arm64 --config Release --deployment-target
            16.0 --fresh
          artifact_path: third/godot-js/addons/godot-js/binary/ios/arm64/libgode_runtime.dylib
          editor_artifact_path: ''
        - platform: android
          arch: arm64
          runner: macos-26
          script: ./shell/build-android.sh --arch arm64 --config Release --fresh
          artifact_path: third/godot-js/addons/godot-js/binary/android/arm64/libgode_runtime.so
          editor_artifact_path: ''
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive
        repository: godothub/gode
        ref: ${{ inputs.gode_ref || 'main' }}
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Install dependencies
      run: python -m pip install -r generator/requirements.txt
    - name: Mask libnode URL
      shell: bash
      env:
        LIBNODE_URL: ${{ inputs.libnode_url || env.LIBNODE_URL }}
      run: |
        if [ -n "$LIBNODE_URL" ]; then
          echo "::add-mask::$LIBNODE_URL"
        fi
    - name: Prepare libnode
      shell: bash
      env:
        LIBNODE_URL: ${{ inputs.libnode_url || env.LIBNODE_URL }}
      run: |
        ./.github/shell/prepare-libnode.sh --url "$LIBNODE_URL"
    - name: Build Windows
      if: matrix.platform == 'windows'
      shell: pwsh
      run: ${{ matrix.script }}
    - name: Build Unix
      if: matrix.platform != 'windows'
      shell: bash
      run: ${{ matrix.script }}
    - name: Upload binary
      uses: actions/upload-artifact@v7
      with:
        name: godot-js-binary-${{ matrix.platform }}-${{ matrix.arch }}
        path: ${{ matrix.artifact_path }}
        if-no-files-found: error
    - name: Upload editor binary
      if: ${{ matrix.editor_artifact_path != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: godot-js-editor-binary-${{ matrix.platform }}-${{ matrix.arch }}
        path: ${{ matrix.editor_artifact_path }}
        if-no-files-found: error
  web:
    name: Web wasm32
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout canonical implementation
      uses: actions/checkout@v6
      with:
        submodules: recursive
        repository: godothub/gode
        ref: ${{ inputs.gode_ref || 'main' }}
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build
        python -m pip install -r generator/requirements.txt scons
    - name: Prepare Lite SDK
      shell: bash
      env:
        LIBNODE_URL: ${{ inputs.libnode_url || env.LIBNODE_URL }}
      run: ./.github/shell/prepare-libnode.sh --url "$LIBNODE_URL"
    - name: Setup Emscripten
      shell: bash
      run: |
        git clone --depth 1 https://github.com/emscripten-core/emsdk "$RUNNER_TEMP/emsdk"
        "$RUNNER_TEMP/emsdk/emsdk" install 5.0.7
        "$RUNNER_TEMP/emsdk/emsdk" activate 5.0.7
    - name: Build Web extension
      shell: bash
      run: |
        source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
        shell/build-web.sh --jobs "$(nproc)"
    - name: Build matching Godot Web template
      shell: bash
      run: |
        source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
        git clone --depth 1 --branch "$GODOT_VERSION" https://github.com/godotengine/godot "$RUNNER_TEMP/godot-web"
        python .github/shell/build-godot-web-template.py \
          --source "$RUNNER_TEMP/godot-web" --output build/web-template --jobs "$(nproc)"
        mkdir -p third/godot-js/addons/godot-js/binary/editor/web
        cp build/web-template/godot.web.template_release.wasm32.dlink.zip \
          third/godot-js/addons/godot-js/binary/editor/web/
    - name: Upload Web extension
      uses: actions/upload-artifact@v7
      with:
        name: godot-js-binary-web-wasm32
        path: third/godot-js/addons/godot-js/binary/web/wasm32/libgode_runtime.wasm
        if-no-files-found: error
    - name: Upload Web export template
      uses: actions/upload-artifact@v7
      with:
        name: godot-js-web-template
        path: third/godot-js/addons/godot-js/binary/editor/web/godot.web.template_release.wasm32.dlink.zip
        if-no-files-found: error
  package:
    name: Package plugin
    runs-on: ubuntu-latest
    needs: [build, web]
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive
        repository: godothub/gode
        ref: ${{ inputs.gode_ref || 'main' }}
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Install dependencies
      run: python -m pip install -r generator/requirements.txt
    - name: Run generator
      run: python generator/generator.py
    - name: Download Windows
      uses: actions/download-artifact@v8
      with:
        name: godot-js-binary-windows-x64
        path: third/godot-js/addons/godot-js/binary/windows/x64
    - name: Download Linux
      uses: actions/download-artifact@v8
      with:
        name: godot-js-binary-linux-x64
        path: third/godot-js/addons/godot-js/binary/linux/x64
    - name: Download macOS
      uses: actions/download-artifact@v8
      with:
        name: godot-js-binary-macos-arm64
        path: third/godot-js/addons/godot-js/binary/macos/arm64
    - name: Download iOS
      uses: actions/download-artifact@v8
      with:
        name: godot-js-binary-ios-arm64
        path: third/godot-js/addons/godot-js/binary/ios/arm64
    - name: Download Android
      uses: actions/download-artifact@v8
      with:
        name: godot-js-binary-android-arm64
        path: third/godot-js/addons/godot-js/binary/android/arm64
    - name: Download Windows editor
      uses: actions/download-artifact@v8
      with:
        name: godot-js-editor-binary-windows-x64
        path: third/godot-js/addons/godot-js/binary/editor/windows/x64
    - name: Download Linux editor
      uses: actions/download-artifact@v8
      with:
        name: godot-js-editor-binary-linux-x64
        path: third/godot-js/addons/godot-js/binary/editor/linux/x64
    - name: Download macOS editor
      uses: actions/download-artifact@v8
      with:
        name: godot-js-editor-binary-macos-arm64
        path: third/godot-js/addons/godot-js/binary/editor/macos/arm64
    - name: Download Web extension
      uses: actions/download-artifact@v8
      with:
        name: godot-js-binary-web-wasm32
        path: third/godot-js/addons/godot-js/binary/web/wasm32
    - name: Download Web export template
      uses: actions/download-artifact@v8
      with:
        name: godot-js-web-template
        path: third/godot-js/addons/godot-js/binary/editor/web
    - name: Package plugin
      id: package
      shell: bash
      run: |
        ./.github/shell/package-plugin.sh --variant godot-js
        echo "archive=dist/godot-js.zip" >> "$GITHUB_OUTPUT"
    - name: Record source provenance
      shell: bash
      run: git rev-parse HEAD > dist/GODE-SOURCE-COMMIT.txt
    - name: Upload plugin
      uses: actions/upload-artifact@v7
      with:
        name: godot-js
        path: |-
          dist/godot-js.zip
          dist/GODE-SOURCE-COMMIT.txt
        if-no-files-found: error
  smoke:
    name: Godot Lite / ${{ matrix.platform }}
    needs: package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: linux
          runner: ubuntu-22.04
        - platform: windows
          runner: windows-2022
        - platform: macos
          runner: macos-26
    steps:
    - name: Checkout canonical tests
      uses: actions/checkout@v6
      with:
        repository: godothub/gode
        ref: ${{ inputs.gode_ref || 'main' }}
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Download plugin
      uses: actions/download-artifact@v8
      with:
        name: godot-js
        path: ${{ runner.temp }}/godot-js-package
    - name: Prepare Godot
      shell: bash
      run: python test/prepare_godot.py --version "$GODOT_VERSION"
    - name: Prepare Lite project
      shell: bash
      run: python .github/shell/prepare-godot-js-smoke.py --archive "$RUNNER_TEMP/godot-js-package/godot-js.zip"
        --project "$RUNNER_TEMP/godot-js-smoke"
    - name: Test bindings and pure JS npm
      shell: bash
      run: |-
        python test/run_godot_smoke.py \
          --godot "$GODOT_BIN" --project "$RUNNER_TEMP/godot-js-smoke" \
          --extension res://addons/godot-js/binary/gode.gdextension \
          --editor-template res://addons/godot-js/binary/gode_editor.gdextension.template \
          --strict-exit-leaks
        python test/run_godot_smoke.py \
          --godot "$GODOT_BIN" --project "$RUNNER_TEMP/godot-js-smoke" \
          --extension res://addons/godot-js/binary/gode.gdextension \
          --editor-template res://addons/godot-js/binary/gode_editor.gdextension.template \
          --scene res://scenes/lite_probe.tscn \
          --marker '[GodotJsLiteTest] pure JS npm and hash passed' \
          --strict-exit-leaks
    - name: Test exported Lite project
      if: matrix.platform == 'linux'
      shell: bash
      run: |
        python test/run_godot_js_export_smoke.py \
          --godot "$GODOT_BIN" --project "$RUNNER_TEMP/godot-js-smoke" \
          --godot-version "$GODOT_VERSION" --install-export-templates \
          --template-download-dir "$RUNNER_TEMP/godot-js-templates"
    - name: Test exported Web project
      if: matrix.platform == 'linux'
      shell: bash
      run: |
        python -m pip install playwright
        python -m playwright install --with-deps chromium
        python test/run_godot_js_web_export_smoke.py \
          --godot "$GODOT_BIN" --project "$RUNNER_TEMP/godot-js-smoke" \
          --output "$RUNNER_TEMP/godot-js-web-smoke"
